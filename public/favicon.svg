<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Rounded Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" stroke="#334155" stroke-width="4" stroke-opacity="0.4"/>
  <rect x="24" y="24" width="464" height="464" rx="92" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.25"/>

  <!-- Glowing Aura -->
  <circle cx="256" cy="240" r="140" fill="#f59e0b" fill-opacity="0.08" filter="url(#glow)"/>

  <!-- Document / Report Layer behind Cap -->
  <rect x="140" y="160" width="232" height="250" rx="20" fill="#1e222d" stroke="#475569" stroke-width="6"/>
  <line x1="180" y1="230" x2="332" y2="230" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
  <line x1="180" y1="270" x2="332" y2="270" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
  <line x1="180" y1="310" x2="280" y2="310" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
  
  <!-- AI Sparks / Nodes -->
  <circle cx="332" cy="355" r="14" fill="url(#cyanGrad)"/>
  <path d="M332 345 L332 365 M322 355 L342 355" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <!-- Graduation Cap (Mortarboard) in Brilliant Gold -->
  <g filter="url(#glow)">
    <!-- Cap Diamond Top -->
    <path d="M256 100 L420 176 L256 248 L92 176 Z" fill="url(#goldGrad)"/>
    <path d="M256 100 L420 176 L256 248 L92 176 Z" stroke="#ffffff" stroke-width="3" stroke-opacity="0.4"/>
    
    <!-- Cap Skull Base -->
    <path d="M152 204 L152 268 C152 296 198 316 256 316 C314 316 360 296 360 268 L360 204 C332 228 296 240 256 240 C216 240 180 228 152 204 Z" fill="#b45309"/>
    
    <!-- Cap Button & Tassel -->
    <circle cx="256" cy="174" r="12" fill="#fffbeb"/>
    <path d="M256 174 Q390 190 408 260 L408 300" stroke="#fef08a" stroke-width="6" fill="none" stroke-linecap="round"/>
    <rect x="400" y="300" width="16" height="34" rx="4" fill="#fbbf24"/>
  </g>

  <!-- Technical Stamp / Checkmark Badge -->
  <circle cx="180" cy="355" r="22" fill="#059669"/>
  <path d="M170 355 L177 362 L192 347" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
